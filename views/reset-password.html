<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Play Nation - Reset Password</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <header>
    <div class="header-container">
      <h1>Play Nation</h1>
      <nav class="nav-links">
        <a href="home.html">Home</a>
        <a href="/login.html" id="authLink">Login</a>
        <a href="#" id="logoutBtn" style="display:none;">Logout</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="form-container">
      <h2>Set New Password</h2>
      <form id="resetForm">
        <input type="hidden" id="token" name="token">
        <div class="form-group">
          <label for="password">New Password</label>
          <input type="password" id="password" name="password" placeholder="Enter new password" required>
        </div>
        <button type="submit">Update Password</button>
      </form>
      <p id="msg" style="margin-top:1rem; color:#27ae60;"></p>
    </div>
  </main>

  <footer>
    <!-- same footer -->
    <div class="footer-container">
      <div class="footer-about"><h3>About Us</h3><p>Play Nation is your one-stop destination for the best mobile and online games.</p></div>
      <div class="footer-links"><h3>Quick Links</h3><ul><li><a href="home.html">Home</a></li></ul></div>
      <div class="footer-contact"><h3>Contact</h3><p>Email: <a href="mailto:info@play_nation.com">info@play_nation.com</a></p></div>
    </div>
    <p class="footer-bottom">&copy; 2025 Play Nation. All rights reserved.</p>
  </footer>

<script src="./js/script.js"></script>
</body>
</html>
