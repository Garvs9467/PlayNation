<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Play Nation - Contact Us</title>
    <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>

    <!-- Header and Desktop Navigation -->
    <header>
        <div class="header-container">
            <h1>🎮 Play Nation</h1>
            <nav class="nav-links">
                <a href="home.html">Home</a>
                <a href="top_games.html">Top Games</a>
                <a href="categories.html">Categories</a>
                <a href="contact.html">Contact</a>
                <a href="/login.html" id="authLink">Login</a>
                <a href="#" id="logoutBtn" style="display:none;">Logout</a>
            </nav>
        </div>
    </header>

    <main>
        <!-- Contact Form Container -->
        <div class="form-container">
            <h2>Get In Touch</h2>
            <form id="contactForm" action="#">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>

                 <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" placeholder="What can we help you with?" required></textarea>
                </div>

                <button type="submit">Send Message</button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-container">
            <div class="footer-about">
                <h3>About Us</h3>
                <p>Play Nation is your one-stop destination for the best mobile and online games.</p>
            </div>
            <div class="footer-links">
                <h3>Quick Links</h3>
                <ul>
                    <li><a href="home.html">Home</a></li>
                    <li><a href="top_games.html">Top Games</a></li>
                </ul>
            </div>
            <div class="footer-contact">
                <h3>Contact</h3>
                <p>Email: <a href="mailto:info@play_nation.com">info@play_nation.com</a></p>
                <p>Follow us:</p>
                <div class="social-icons">
                    <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/733/733558.png" alt="Instagram"></a>
                    <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" alt="Twitter"></a>
                </div>
            </div>
        </div>
        <p class="footer-bottom">&copy; 2025 Play Nation. All rights reserved.</p>
    </footer>

    <script src="./js/script.js"></script>
</body>
</html>
